# Grafana 数据源自动装配（容器启动即生效，无需手工点 UI 添加）
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 容器内通过服务名互访，不是 localhost
    url: http://prometheus:9090
    isDefault: true
    uid: codejudge-prom
    editable: false
    jsonData:
      timeInterval: 15s
      # 用 Prometheus 的 label 做 Grafana 变量（如多选 application）
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.54.1
