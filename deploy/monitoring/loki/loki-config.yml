# Loki 本地单机配置（3.x schema v13）
# 端口 3100；单副本 filesystem 存储，保留 15 天（与 Prometheus 对齐）
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 单机模式必须显式关掉 ring 推广等集群行为
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 360h   # 15 天，与 Prometheus 保留期对齐

ruler:
  alertmanager_url: http://alertmanager:9093
