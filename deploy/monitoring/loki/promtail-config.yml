# Promtail：抓宿主机 <repo>/logs/*.log -> Loki
# judge-* 服务日志由 dev-start-backend.py 写到 logs/<module>-<port>.dev.log（纯文本）。
# 服务名从文件名提取为 application 标签；requestId 用正则抽取为结构化标签，
# 这样 Grafana 里可以用 {application="judge-submission"} |= "..." / | request_id="..." 查询。
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: codejudge
    static_configs:
      - targets:
          - localhost
        labels:
          job: codejudge
          host: host.docker.internal
          __path__: /var/log/codejudge/*.log
    pipeline_stages:
      # 从文件名 judge-submission-9084.dev.log 提取服务名
      - match:
          selector: '{job="codejudge"}'
          stages:
            # ⚠️ 正斜杠路径：promtail 在容器内看到的 filename 是 /var/log/codejudge/xxx.log。
            #   旧写法 (?P<base>[^/\\]+)\\.log$ 里的 \\ 要求字面反斜杠 —— 永不匹配，
            #   application 标签从未产出（2026-10-01 容器化实测发现并修正）。
            - regex:
                source: filename
                expression: '/var/log/codejudge/(?P<application>judge-[a-z]+)'
            - labels:
                application:
      # requestId 抽取：日志形如 "... requestId=xxxx ..."（judge-common 透传字段的落日志形态）
      # JSON 行（prod）里形如 "requestId":"..."，带引号不会命中本正则 —— 属预期：
      # 结构化查询走 Loki 的 | json 解析器，本标签只为旧人读格式提供直查便利。
      - regex:
          expression: '.*requestId[=:](?P<request_id>[0-9a-zA-Z-]+).*'
      - labels:
          request_id:
