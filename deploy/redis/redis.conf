# ============================================================
# CodeJudge 分布式在线编程评测平台 —— Redis 部署配置（Redis 7）
# 由 docker-compose 挂载覆盖 /usr/local/etc/redis/redis.conf
# 密码不写死于此：通过 docker-compose 的命令参数 --requirepass ${REDIS_PASSWORD} 注入
# ============================================================

# ---------- 网络与安全 ----------
bind 0.0.0.0
protected-mode yes
# 容器内保持默认 6379；宿主机通过 docker-compose 映射到 6380 避让 zx-learn
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------- 进程 ----------
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# ---------- 数据库 ----------
databases 16

# ---------- RDB 持久化 ----------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------- AOF 持久化（判题幂等锁/提交去重 key、竞赛榜 ZSet 不允许静默丢失） ----------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-rewrite-incremental-fsync yes
aof-load-truncated yes

# ---------- 内存策略 ----------
# judge:submission:idempotent:*（提交去重）、judge:task:lock:*（判题幂等锁）、
# judge:contest:rank:*（竞赛实时榜）这三类 key 一旦被淘汰就会造成
# 「重复判题」「榜单掉分」「幂等失效」等静默错误，因此使用 noeviction：
# 内存满时写入报错而非驱逐数据，配合监控告警扩容。
maxmemory 512mb
maxmemory-policy noeviction
maxmemory-samples 5
lazyfree-lazy-eviction yes

# ---------- 慢查询与观测 ----------
# 判题队列 judge:judge:queue:zset 的操作必须在 10ms 内完成，超时即需排查
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 0
