# ============================================================
# CodeJudge RocketMQ Broker 配置（容器化 compose 形态专用）
#
# 为什么有两份 broker 配置：
#   broker 向 namesrv 注册的地址 = brokerIP1:listenPort，客户端直接拿它连接。
#   · 宿主机直跑形态（dev-start-backend.py 起 jar）：jar 在宿主上，必须注册
#     127.0.0.1 才能连上发布到宿主环回的 10921 → 用 broker.conf。
#   · 容器化形态（docker compose --profile app）：worker 在 compose 网络内，
#     注册 127.0.0.1 会让它连到 worker 自己 → 必须注册服务名
#     rocketmq-broker → 用本文件。
#   两份文件除 brokerIP1 外完全一致，改任何判题相关参数（如
#   messageDelayLevel）必须同步两处 —— 见 docker-compose.yml 挂载处注释。
#
#   想让两种形态共存（推荐）：在 Windows 宿主 hosts 文件加一行
#     127.0.0.1 rocketmq-broker
#   宿主 jar 解析该主机名 → 127.0.0.1 → 发布端口 10921，与容器内客户端
#   （走 docker DNS）殊途同归，此后只需维护本文件。
# ============================================================
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 允许自动创建主题，便于本地联调（生产应置 false 并预先创建 judge_submission 等主题）
autoCreateTopicEnable=true
# 容器形态：注册服务名，客户端经 docker DNS 解析到 broker 容器 IP
brokerIP1=rocketmq-broker
# 主端口（宿主机映射同号；fast=10919，HA=10922）
listenPort=10921
# 自定义延迟级别：判题重试退避直接用延迟消息，无需自建延迟队列。
# 常用索引：15 = 15 分钟（判题超时兜底）、14 = 10 分钟、12 = 5 分钟
messageDelayLevel=1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 15m 20m 30m 1h 2h
# 容器内通过 namesrv 服务名解析（compose 下覆盖为服务名）
namesrvAddr=rocketmq-namesrv:9876
