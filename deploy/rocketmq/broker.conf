# ============================================================
# CodeJudge RocketMQ Broker 配置（Docker Compose 挂载）
#
# ⚠ 端口避让（易漏点）：zx-learn 占用 namesrv 9876 + broker 10909/10911/10912。
#   CodeJudge 不能只避让 namesrv —— broker 三个端口必须同步改，否则
#   两个项目的 broker 会抢同一端口导致启动失败。
#   RocketMQ 4.9 的端口关系：listenPort 为主端口，
#     fastRemotingPort = listenPort - 2（这里 10919）
#     HA 端口          = listenPort + 1（这里 10922）
#   因此本文件必须与 docker-compose.yml 的端口映射保持一致。
# ============================================================
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 允许自动创建主题，便于本地联调（生产应置 false 并预先创建 judge_submission 等主题）
autoCreateTopicEnable=true
# 本地同一台机器：让宿主机 Java 应用可通过 127.0.0.1 直连 broker
brokerIP1=127.0.0.1
# 主端口（宿主机映射同号；fast=10919，HA=10922）
listenPort=10921
# 自定义延迟级别：判题重试退避直接用延迟消息，无需自建延迟队列。
# 常用索引：15 = 15 分钟（判题超时兜底）、14 = 10 分钟、12 = 5 分钟
messageDelayLevel=1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 15m 20m 30m 1h 2h
# 容器内通过 namesrv 服务名解析（compose 下覆盖为服务名）
namesrvAddr=rocketmq-namesrv:9876
