# CodeJudge TLS 终结（U8 前置 rehearsal，2026-10-05）
#
# 拓扑：客户端 --HTTPS:9443--> nginx(tls-terminator) --HTTP--> judge-gateway:9080
# 网关本身不变（9080 纯 HTTP），TLS 在前置代理终结 —— 与 HANDOFF U8 方案「网关 9080 前置 TLS 终结」一致。
#
# 【rehearsal 与上线的差别】只有证书两行：
#   rehearsal：deploy/tls/certs/dev.{crt,key}（自签 365 天，CN=codejudge.local，SAN 覆盖 localhost/127.0.0.1）
#   上线时  ：换成 CA 签发的真实证书（fullchain.crt + 私钥），并在 ssl_certificate 指向新文件名；
#             若需要 SNI 多域名，再拆 server 块。其余配置一行不用改。
#
# 启动（在仓库根）：
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile tls up -d tls-terminator
# 验证：
#   curl.exe -sk "https://127.0.0.1:9443/problems/page?page=1&size=1"   # 200 + JSON（走网关公开读路径）
#   curl.exe -sk -I "https://127.0.0.1:9443/problems/page"              # HTTP/1.1 200 OK（TLS 握手成功）
#
# 证书目录（deploy/tls/certs/）不入库：私钥原则上不进 git；上线证书同理由部署方放置。
# 见 .gitignore 的 deploy/tls/certs/ 条目。

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 上线硬ening清单（真证书到位时逐项打开）：
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://host.docker.internal:9080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket（竞赛榜单 /ws/contests/{id}/rank、AI 点评流经网关 SSE）升级透传
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
