# ============================================================
# CodeJudge 分布式在线编程评测平台 —— 基础设施一键启动
#
# 组件：MySQL 8 / Redis 7 / PostgreSQL + pgvector / RocketMQ 4.9.7 (+Dashboard) / MinIO
# 用法：cp .env.example .env && 填写密码 && docker compose up -d
#
# 端口避让：本机同时存在 zx-learn（占用 3306/6379/5432/9876/10909/10911/10912/18080），
#   CodeJudge 整体换段，其中 **RocketMQ broker 的三个端口最容易漏改**，
#   与 deploy/rocketmq/broker.conf 的 listenPort 必须一致：
#     namesrv 9877 ｜ broker 10919(fast) / 10921(main) / 10922(HA) ｜ dashboard 18081
# ============================================================
services:
  # ---------- MySQL：业务库（auth / user / problem / submission / contest） ----------
  mysql:
    image: mysql:8.0
    container_name: codejudge-mysql
    restart: always
    # 入口点包装：MySQL 8 启动时**会拒绝加载"全局可写"的配置文件**
    #    （`World-writable config file '/etc/mysql/conf.d/my.cnf' is ignored.`），
    #    而 Windows 宿主的 bind-mount 文件权限位固定为 0777、在容器内 chmod 也不生效
    #    （9p/virtiofs 不落权限位）。
    #    后果极隐蔽：容器照常 healthy、服务照常连接，但 my.cnf 里**一项配置都没生效**
    #    —— 实测曾长期停留在 REPEATABLE-READ / buffer_pool 128M / max_connections 151。
    #    对策：把 my.cnf 挂到**非自动加载路径**，启动时用 install 复制成 0644 落到 conf.d
    #    再交回原入口点，让 `!includedir /etc/mysql/conf.d/` 正常加载它。
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        install -m 0644 /opt/codejudge/my.cnf /etc/mysql/conf.d/my.cnf
        exec /usr/local/bin/docker-entrypoint.sh mysqld
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 已被 zx-learn 占用，默认映射 3307；如仍冲突可在 .env 配 MYSQL_BIND_PORT
      # 绑定回环：中间件不对局域网暴露（root 口令的 MySQL/Redis/PG 挂在 0.0.0.0 上，
      # 接入不可信 Wi-Fi 即全网可访问）。确需局域网访问时用 .env 的 BIND_IP 覆盖
      - "${BIND_IP:-127.0.0.1}:${MYSQL_BIND_PORT:-3307}:3306"
    volumes:
      - codejudge-mysql-data:/var/lib/mysql
      # 挂到非 includedir 路径，理由见上方 entrypoint 注释
      - ./deploy/mysql/my.cnf:/opt/codejudge/my.cnf:ro
      # 01/02 前缀保证执行顺序：先建库建表，再灌种子数据
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis：判题队列 / 幂等锁 / 竞赛实时榜 ----------
  redis:
    image: redis:7
    container_name: codejudge-redis
    restart: always
    ports:
      # 宿主机 6379 已被 zx-learn 占用，映射 6380
      - "${BIND_IP:-127.0.0.1}:${REDIS_BIND_PORT:-6380}:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
    volumes:
      - codejudge-redis-data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- PostgreSQL + pgvector：AI 点评的 RAG 向量知识库 ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codejudge-pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
      POSTGRES_DB: judge_ai
      TZ: Asia/Shanghai
    ports:
      # 宿主机 5432 已被 zx-learn 占用，映射 5433
      - "${BIND_IP:-127.0.0.1}:${POSTGRES_BIND_PORT:-5433}:5432"
    volumes:
      - codejudge-pg-data:/var/lib/postgresql/data
      - ./deploy/pgvector/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d judge_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- RocketMQ：提交异步判题链路（created / retry / result / dlq） ----------
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: codejudge-mq-namesrv
    restart: always
    ports:
      # 宿主机 9876 已被 zx-learn 占用，映射 9877
      - "${BIND_IP:-127.0.0.1}:${ROCKETMQ_NAMESRV_BIND_PORT:-9877}:9876"
    command: sh mqnamesrv

  # 一次性初始化容器：把 store 命名卷的属主修成 uid=3000(rocketmq)。
  # 直接挂卷为什么起不来 —— 见 rocketmq-broker 下方的踩坑注释（2026-09-20 实测 ExitCode=253）。
  # 用 apache/rocketmq 镜像自身跑 chown（user 覆盖为 root），不引入 alpine/busybox
  # 这类可能被受限网络拒拉的新镜像。跑完即退出（Exited(0) 属预期）。
  rocketmq-store-init:
    image: apache/rocketmq:4.9.7
    container_name: codejudge-mq-store-init
    user: "0:0"
    volumes:
      - codejudge-mq-store:/home/rocketmq/store
    command: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store && chmod 700 /home/rocketmq/store"]
    restart: "no"

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: codejudge-mq-broker
    restart: always
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      # 必须等属主修好再挂卷，否则 broker 仍会以 rocketmq 身份撞上 root:root 挂载点
      rocketmq-store-init:
        condition: service_completed_successfully
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 规避 JDK8 在 cgroup v2（Docker Desktop/WSL2）下 OperatingSystemMXBean NPE
      # 导致 StoreUtil.<clinit> 失败、消费位点查询全挂的已知问题
      JAVA_OPT_EXT: "-XX:-UseContainerSupport"
    ports:
      # 与 deploy/rocketmq/broker.conf 的 listenPort=10921 严格对应：
      #   fastRemotingPort = 10919，主端口 = 10921，HA 端口 = 10922
      - "${BIND_IP:-127.0.0.1}:10919:10919"
      - "${BIND_IP:-127.0.0.1}:10921:10921"
      - "${BIND_IP:-127.0.0.1}:10922:10922"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-4.9.7/conf/broker.conf:ro
      # 消息持久化（2026-09-30 落地，原「故意不挂载」决策废止）：
      #   当初不挂的原因：镜像内不存在 /home/rocketmq/store，Docker 为命名卷创建的
      #   挂载点是 root:root，broker 进程（uid=3000）无写权限 → 启动即退（ExitCode=253，日志为空）。
      #   现由 rocketmq-store-init 一次性容器以 root 把卷 chown 成 3000:3000，
      #   broker 经 depends_on(service_completed_successfully) 晚于它挂卷 —— 持久化生效，
      #   容器重建不再丢队列（重启丢消息的上线风险关闭）。
      - codejudge-mq-store:/home/rocketmq/store
    command: sh mqbroker -c /home/rocketmq/rocketmq-4.9.7/conf/broker.conf

  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:2.0.0
    container_name: codejudge-mq-console
    restart: always
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      # 宿主机 8080 预留给 judge-gateway 统一入口，控制台映射到 18081
      # 访问：http://localhost:18081
      - "${BIND_IP:-127.0.0.1}:${ROCKETMQ_CONSOLE_BIND_PORT:-18081}:8080"

  # ---------- MinIO：判题代码（超长代码）与题目附件的对象存储 ----------
  # 同时挂在 storage / app 两个 profile 下（2026-09-30 调整，原仅 storage）：
  #   · judge-submission / judge-worker 的容器化部署依赖 minio:9000（environment 强制覆盖），
  #     `--profile app` 起应用时 MinIO 必须随之就绪，否则超长代码上传/读取直接失败 ——
  #     所以它事实上是 app 的依赖而非常驻基础设施，单独一个 storage profile 反而制造假象；
  #   · 保留 storage profile 是为了兼容「只要 MinIO 不要应用」的调试场景：
  #     docker compose --profile storage up -d minio
  #   · 部分受限网络下 minio/minio 镜像拉取可能被拒（实测 error from registry: denied），
  #     镜像缺失时 app 编排会卡在 minio 拉取 —— 需人工预拉镜像或临时注释掉本服务与两处 depends_on。
  minio:
    image: minio/minio
    container_name: codejudge-minio
    profiles: ["storage", "app"]
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中配置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中配置 MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 9000 = S3 API（应用访问），9001 = Web 控制台（浏览器访问）
      - "${BIND_IP:-127.0.0.1}:${MINIO_API_BIND_PORT:-9000}:9000"
      - "${BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_BIND_PORT:-9001}:9001"
    volumes:
      - codejudge-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # 多副本与负载均衡（F1）：除 judge-worker 外的 app 服务均可 --scale 水平扩，
  # 故不设 container_name（与 --scale 互斥）。LB：容器内用 nginx 反代时，
  # Docker DNS 对同一 service 名自动轮询（dnsrr 需 swarm；普通 compose 用 --scale 即有基础轮询）。
  # 判题机扩容方向见 docs/PERF.md §3.7：加实例不涨吞吐，勿盲目 --scale judge-worker。
  # ------------------------------------------------------------
  # ============================================================
  # 应用层（app profile）：8 后端 + 前端
  # 启动：先 `docker compose up -d` 起基础设施，再
  #   docker compose --profile app up -d          （需要先构建镜像，见下）
  # 校验：docker compose --profile app config
  # 镜像构建（上下文=仓库根）：
  #   for m in judge-gateway judge-auth judge-user judge-problem judge-submission judge-worker judge-contest judge-ai; do
  #     docker build -f $m/Dockerfile -t codejudge/$m:latest . ; done
  #   docker build -f judge-web/Dockerfile -t codejudge/judge-web:latest judge-web/
  # 注意：
  #   · 环境密钥经 env_file(.env) 注入；容器间连接地址在 environment 段**强制覆盖**为
  #     compose 网络内的服务名（.env 里的 localhost:* 仅适用于宿主机直跑 jar 的场景）。
  #   · judge-worker 需要 docker CLI + /var/run/docker.sock 才能派发沙箱容器。
  #     ⚠️ 待验证项：沙箱代码经宿主 docker daemon 派发，worker 容器内的临时目录
  #     与宿主路径不对齐时挂载会落空 —— 容器化 worker 首次启用前必须回归 verify-p3。
  #   · stop_grace_period 40s > graceful 30s（application.yml），保证 in-flight 请求排空。
  # ============================================================
  judge-user:
    image: codejudge/judge-user:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SVC_PROBLEM_URI: http://judge-problem:9083
      SVC_SUBMISSION_URI: http://judge-submission:9084
      SVC_CONTEST_URI: http://judge-contest:9086
    ports:
      - "${BIND_IP:-127.0.0.1}:9082:9082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge-auth:
    image: codejudge/judge-auth:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SVC_USER_URI: http://judge-user:9082
    ports:
      - "${BIND_IP:-127.0.0.1}:9081:9081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-user:
        condition: service_started

  judge-problem:
    image: codejudge/judge-problem:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    ports:
      - "${BIND_IP:-127.0.0.1}:9083:9083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge-submission:
    image: codejudge/judge-submission:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      MINIO_ENDPOINT: http://minio:9000
      SVC_PROBLEM_URI: http://judge-problem:9083
      SVC_CONTEST_URI: http://judge-contest:9086
    ports:
      - "${BIND_IP:-127.0.0.1}:9084:9084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      minio:
        condition: service_healthy

  judge-worker:
    image: codejudge/judge-worker:latest
    container_name: codejudge-judge-worker
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      MINIO_ENDPOINT: http://minio:9000
      SVC_PROBLEM_URI: http://judge-problem:9083
      # 多实例必须限并发：实例数 × 该值 ≤ 宿主 CPU 核数，否则正确解被误判 TLE
      CJ_MQ_CONSUME_THREADS: "4"
    ports:
      - "${BIND_IP:-127.0.0.1}:9085:9085"
    volumes:
      # 沙箱容器由 worker 经宿主 docker daemon 派发（见上方注意事项）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      minio:
        condition: service_healthy

  judge-contest:
    image: codejudge/judge-contest:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SVC_PROBLEM_URI: http://judge-problem:9083
      SVC_SUBMISSION_URI: http://judge-submission:9084
      SVC_USER_URI: http://judge-user:9082
    ports:
      - "${BIND_IP:-127.0.0.1}:9086:9086"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started

  judge-ai:
    image: codejudge/judge-ai:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      POSTGRES_URL: jdbc:postgresql://postgres:5432/judge_ai
      SVC_PROBLEM_URI: http://judge-problem:9083
      SVC_SUBMISSION_URI: http://judge-submission:9084
    ports:
      - "${BIND_IP:-127.0.0.1}:9087:9087"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started

  judge-gateway:
    image: codejudge/judge-gateway:latest
    profiles: ["app"]
    restart: always
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      GW_AUTH_URI: http://judge-auth:9081
      GW_USER_URI: http://judge-user:9082
      GW_PROBLEM_URI: http://judge-problem:9083
      GW_SUBMISSION_URI: http://judge-submission:9084
      GW_CONTEST_URI: http://judge-contest:9086
      GW_AI_URI: http://judge-ai:9087
    ports:
      - "${BIND_IP:-127.0.0.1}:9080:9080"
    depends_on:
      judge-auth:
        condition: service_started
      judge-user:
        condition: service_started
      judge-problem:
        condition: service_started
      judge-submission:
        condition: service_started
      judge-contest:
        condition: service_started
      judge-ai:
        condition: service_started

  judge-web:
    image: codejudge/judge-web:latest
    container_name: codejudge-judge-web
    profiles: ["app"]
    restart: always
    stop_grace_period: 20s
    ports:
      # 前端约定端口 5174 -> 容器 nginx 80（同源代理 /api 与 /ws）
      - "${BIND_IP:-127.0.0.1}:5174:80"
    depends_on:
      judge-gateway:
        condition: service_started

volumes:
  codejudge-mysql-data:
  codejudge-redis-data:
  codejudge-pg-data:
  codejudge-minio-data:
  codejudge-mq-store:
