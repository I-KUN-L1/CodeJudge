server:
  port: 9081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # CORS：前端「系统监控」页从浏览器**直连**本端口读 /actuator/health 与
      # /actuator/prometheus（actuator 不在网关路由内）。此处不配，跨源响应会被
      # 浏览器整体拦截（CORS 由浏览器执行）→ 监控页 8 个服务全部显示「不可达」，
      # 与服务是否存活无关。只放行前端本地来源 + GET，与网关 globalcors 同一环境变量；
      # Prometheus/Grafana 的抓取是服务端到服务端，不受 CORS 影响，无需额外放开。
      cors:
        allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
        max-age: 3600
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 统一 application 标签：Grafana 用 `application` 做多服务切换/聚合。
      # 不设的话只能按 instance(host:port) 聚合，端口一变面板全废。
      application: ${spring.application.name}
    distribution:
      # 直方图：让 Prometheus 能用 histogram_quantile() 算 P95/P99 延迟。
      # 不开只能拿到 _count/_sum/_max（平均值会掩盖长尾），"延迟" 面板就失去意义。
      percentiles-histogram:
        http.server.requests: true

spring:
  flyway:
    # C1 schema 版本化：V1__baseline.sql 与 sql/init.sql 同源（init.sql 保留为首次建库脚本）
    # 存量数据卷首次启动打 baseline(=1) 跳过 V1，不会对已有表重放 DDL
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  lifecycle:
    # graceful shutdown: upper bound waiting in-flight requests (pair with stop_grace_period >= 40s)
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: judge-auth
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # judge_auth 只承载 RBAC 与登录流水；账号/密码（BCrypt）在 judge_user.user，
    # 登录时经 Feign UserClient 校验（见 AccountService）。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/judge_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        # 关闭 Nacos 时靠各服务下方的 static simple.instances 直连；生产置 NACOS_ENABLED=true 并指向注册中心
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    # 本地开发直连：关闭 Nacos 后，通过 SimpleDiscoveryClient 提供静态服务地址（生产环境删除此段并启用 Nacos）
    discovery:
      client:
        simple:
          instances:
            judge-user:
              - uri: ${SVC_USER_URI:http://localhost:9082}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    # 生产置 CJ_SPRINGDOC_ENABLED=false 关闭 /v3/api-docs 与 doc.html（knife4j 在 judge-common，全服务暴露）
    enabled: ${CJ_SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${CJ_SPRINGDOC_ENABLED:true}

# JWT 签名密钥：由环境变量 CJ_JWT_SECRET 注入（见项目根目录 .env.example）
cj:
  jwt:
    secret: ${CJ_JWT_SECRET}
  admin-bootstrap:
    # 首个管理员初始凭据落盘路径（相对应用根目录）；由环境变量 CJ_ADMIN_CREDENTIAL_FILE 覆盖
    credential-file: ${CJ_ADMIN_CREDENTIAL_FILE:.bootstrap-credentials}
    # 首个管理员手机号/用户名，可由环境变量覆盖
    admin-phone: ${CJ_ADMIN_PHONE:13800000000}
    admin-username: ${CJ_ADMIN_USERNAME:admin}
    # 首个管理员初始密码。**刻意不给默认值**（历史上是 123456）：
    #   有默认值 = 漏配时静默创建一个人尽皆知的管理员账号，且启动无任何提示。
    #   留空时由 AdminBootstrapService 生成一次性随机强口令并写入 credential-file，
    #   形态与"配置了 CJ_ADMIN_INIT_PASSWORD"完全区分得开（见启动日志）。
    init-password: ${CJ_ADMIN_INIT_PASSWORD:}
