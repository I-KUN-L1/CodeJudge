server:
  port: 9081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 统一 application 标签：Grafana 用 `application` 做多服务切换/聚合。
      # 不设的话只能按 instance(host:port) 聚合，端口一变面板全废。
      application: ${spring.application.name}
    distribution:
      # 直方图：让 Prometheus 能用 histogram_quantile() 算 P95/P99 延迟。
      # 不开只能拿到 _count/_sum/_max（平均值会掩盖长尾），"延迟" 面板就失去意义。
      percentiles-histogram:
        http.server.requests: true

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: judge-auth
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # judge_auth 只承载 RBAC 与登录流水；账号/密码（BCrypt）在 judge_user.user，
    # 登录时经 Feign UserClient 校验（见 AccountService）。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/judge_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        # 关闭 Nacos 时靠各服务下方的 static simple.instances 直连；生产置 NACOS_ENABLED=true 并指向注册中心
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    # 本地开发直连：关闭 Nacos 后，通过 SimpleDiscoveryClient 提供静态服务地址（生产环境删除此段并启用 Nacos）
    discovery:
      client:
        simple:
          instances:
            judge-user:
              - uri: ${SVC_USER_URI:http://localhost:9082}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# JWT 签名密钥：由环境变量 CJ_JWT_SECRET 注入（见项目根目录 .env.example）
cj:
  jwt:
    secret: ${CJ_JWT_SECRET}
  admin-bootstrap:
    # 首个管理员初始凭据落盘路径（相对应用根目录）；由环境变量 CJ_ADMIN_CREDENTIAL_FILE 覆盖
    credential-file: ${CJ_ADMIN_CREDENTIAL_FILE:.bootstrap-credentials}
    # 首个管理员手机号/用户名，可由环境变量覆盖
    admin-phone: ${CJ_ADMIN_PHONE:13800000000}
    admin-username: ${CJ_ADMIN_USERNAME:admin}
    # 系统预设初始密码（纯数字，默认 123456，与默认学员/教师种子账号一致）
    init-password: ${CJ_ADMIN_INIT_PASSWORD:123456}
