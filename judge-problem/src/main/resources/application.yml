server:
  port: 9083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # CORS：前端「系统监控」页从浏览器**直连**本端口读 /actuator/health 与
      # /actuator/prometheus（actuator 不在网关路由内）。此处不配，跨源响应会被
      # 浏览器整体拦截（CORS 由浏览器执行）→ 监控页 8 个服务全部显示「不可达」，
      # 与服务是否存活无关。只放行前端本地来源 + GET，与网关 globalcors 同一环境变量；
      # Prometheus/Grafana 的抓取是服务端到服务端，不受 CORS 影响，无需额外放开。
      cors:
        allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
        max-age: 3600
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 统一 application 标签：Grafana 用 `application` 做多服务切换/聚合。
      # 不设的话只能按 instance(host:port) 聚合，端口一变面板全废。
      application: ${spring.application.name}
    distribution:
      # 直方图：让 Prometheus 能用 histogram_quantile() 算 P95/P99 延迟。
      # 不开只能拿到 _count/_sum/_max（平均值会掩盖长尾），"延迟" 面板就失去意义。
      percentiles-histogram:
        http.server.requests: true

spring:
  flyway:
    # C1 schema 版本化：V1__baseline.sql 与 sql/init.sql 同源（init.sql 保留为首次建库脚本）
    # 存量数据卷首次启动打 baseline(=1) 跳过 V1，不会对已有表重放 DDL
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  lifecycle:
    # graceful shutdown: upper bound waiting in-flight requests (pair with stop_grace_period >= 40s)
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: judge-problem
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 题目域独立库：problem / problem_version / test_case / tag / problem_tag 五张表。
    # 隐藏用例（test_case.is_hidden=1）只在本库内，且仅对题目归属教师与管理员下发。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/judge_problem?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      # 说明：P3 起 judge-problem 依赖 judge-api，其 P1 设计已引入 data-redis 传递依赖
      # （RoleCache 需要_kv），Redis 自动配置随之激活并注册健康检查 —— 若不提供连接信息，
      # healthcheck 会连默认 localhost:6379 判 DOWN。本模块自身暂不读写 Redis。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        # 关闭 Nacos 时靠网关 GW_PROBLEM_URI 直连；生产置 NACOS_ENABLED=true 并指向注册中心
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    # 生产置 CJ_SPRINGDOC_ENABLED=false 关闭 /v3/api-docs 与 doc.html（knife4j 在 judge-common，全服务暴露）
    enabled: ${CJ_SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${CJ_SPRINGDOC_ENABLED:true}
