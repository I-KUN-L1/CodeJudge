server:
  port: 9084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # CORS：前端「系统监控」页从浏览器**直连**本端口读 /actuator/health 与
      # /actuator/prometheus（actuator 不在网关路由内）。此处不配，跨源响应会被
      # 浏览器整体拦截（CORS 由浏览器执行）→ 监控页 8 个服务全部显示「不可达」，
      # 与服务是否存活无关。只放行前端本地来源 + GET，与网关 globalcors 同一环境变量；
      # Prometheus/Grafana 的抓取是服务端到服务端，不受 CORS 影响，无需额外放开。
      cors:
        allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
        max-age: 3600
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 统一 application 标签：Grafana 用 `application` 做多服务切换/聚合。
      # 不设的话只能按 instance(host:port) 聚合，端口一变面板全废。
      application: ${spring.application.name}
    distribution:
      # 直方图：让 Prometheus 能用 histogram_quantile() 算 P95/P99 延迟。
      # 不开只能拿到 _count/_sum/_max（平均值会掩盖长尾），"延迟" 面板就失去意义。
      percentiles-histogram:
        http.server.requests: true

spring:
  flyway:
    # C1 schema 版本化：V1__baseline.sql 与 sql/init.sql 同源（init.sql 保留为首次建库脚本）
    # 存量数据卷首次启动打 baseline(=1) 跳过 V1，不会对已有表重放 DDL
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  lifecycle:
    # graceful shutdown: upper bound waiting in-flight requests (pair with stop_grace_period >= 40s)
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: judge-submission
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 提交域独立库：submission / judge_task / judge_result / compile_info 四张表。
    # judge-worker 直接读写本库（判题执行的单写者），本服务负责受理与调度。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/judge_submission?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    # 关闭 Nacos 时经 SimpleDiscoveryClient 静态实例直连
    #   judge-problem → 判题信息（内部契约）
    #   judge-contest → 竞赛提交校验（竞赛不存在/未进行/未报名时拒绝受理，避免污染榜单）
    discovery:
      client:
        simple:
          instances:
            judge-problem:
              - uri: ${SVC_PROBLEM_URI:http://localhost:9083}
            judge-contest:
              - uri: ${SVC_CONTEST_URI:http://localhost:9086}

# RocketMQ：生产者（CREATED/RETRY/DLQ）+ 消费者（RESULT 事件）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9877}
  producer-group: cj_submission_producer
  consumer-group: cj_submission_result_consumer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 判题调度参数（对齐 .env 的 CJ_JUDGE_* 前缀）
cj:
  judge:
    task-timeout-ms: ${CJ_JUDGE_TASK_TIMEOUT_MS:60000}
    max-attempt: ${CJ_JUDGE_MAX_ATTEMPT:3}
    submit-rate-limit-per-min: ${CJ_SUBMIT_RATE_LIMIT:30}
    idempotent-ttl-seconds: 60
    pending-rescue-delay-ms: 15000
  # WebSocket 判题进度推送（/ws/submissions/{id}）；judge-common 的推送基座由此开关激活
  ws:
    enabled: true
    channel: ${CJ_WS_CHANNEL:judge:ws:broadcast}
    heartbeat-interval-ms: ${CJ_WS_HEARTBEAT_MS:30000}
    send-time-limit-ms: 5000
    buffer-size-limit-bytes: 262144
    max-sessions-per-topic: 5000

springdoc:
  api-docs:
    # 生产置 CJ_SPRINGDOC_ENABLED=false 关闭 /v3/api-docs 与 doc.html（knife4j 在 judge-common，全服务暴露）
    enabled: ${CJ_SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${CJ_SPRINGDOC_ENABLED:true}

logging:
  level:
    com.codejudge.submission: info
