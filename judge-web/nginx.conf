# ============================================================
# CodeJudge 前端 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
# 要点：SPA history fallback ｜ /api 反代网关 ｜ WebSocket Upgrade ｜ SSE 关缓冲
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传代码体积保护（与网关保持同一量级）
    client_max_body_size 2m;

    # ---------- SPA history fallback ----------
    # 静态资源命中直接返回；未命中一律回退 index.html（前端路由接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，可放心 immutable）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- REST 反代：/api/** -> judge-gateway:9080/**（去前缀） ----------
    # 与 vite 开发代理（vite.config.js rewrite ^/api -> ''）行为一致
    location /api/ {
        proxy_pass http://judge-gateway:9080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api/ai/** 流式点评）必须关缓冲、不设超时上限，
        # 否则 DELTA 帧被缓冲成整段、长连接被 60s 默认读超时掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE 是长连接：随 /api 一并对上游 keepalive 复用即可
    }

    # ---------- WebSocket 反代：/ws/**（判题进度 / 竞赛榜） ----------
    # WS_BASE 由页面主机推导（无 /api 前缀），此处按原路径转发
    location /ws/ {
        proxy_pass http://judge-gateway:9080;
        proxy_http_version 1.1;
        # Upgrade/Connection 头是 WS 握手的硬性要求
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 可选：直连监控栈（生产建议经网关或独立域名，此处仅排障用） ----------
    # location /grafana/ { proxy_pass http://grafana:3000/; }
}
