server:
  port: 9085
  shutdown: graceful
  # 判题机多实例：9085 / 9185 / 9285（--server.port 覆盖）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # CORS：前端「系统监控」页从浏览器**直连**本端口读 /actuator/health 与
      # /actuator/prometheus（actuator 不在网关路由内）。此处不配，跨源响应会被
      # 浏览器整体拦截（CORS 由浏览器执行）→ 监控页 8 个服务全部显示「不可达」，
      # 与服务是否存活无关。只放行前端本地来源 + GET，与网关 globalcors 同一环境变量；
      # Prometheus/Grafana 的抓取是服务端到服务端，不受 CORS 影响，无需额外放开。
      cors:
        allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
        max-age: 3600
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 统一 application 标签：Grafana 用 `application` 做多服务切换/聚合。
      # 不设的话只能按 instance(host:port) 聚合，端口一变面板全废。
      application: ${spring.application.name}
    distribution:
      # 直方图：让 Prometheus 能用 histogram_quantile() 算 P95/P99 延迟。
      # 不开只能拿到 _count/_sum/_max（平均值会掩盖长尾），"延迟" 面板就失去意义。
      percentiles-histogram:
        http.server.requests: true

spring:
  lifecycle:
    # graceful shutdown: upper bound waiting in-flight requests (pair with stop_grace_period >= 40s)
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: judge-worker
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # worker 直接读写 judge_submission 库（判题执行的单写者：judge_result/compile_info/submission 终态）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/judge_submission?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    discovery:
      client:
        simple:
          instances:
            judge-problem:
              - uri: ${SVC_PROBLEM_URI:http://localhost:9083}

# RocketMQ：worker 既是消费者（CREATED/RETRY）也是生产者（自产 RETRY / 发布 RESULT / 投递 DLQ），
# 生产者组与 judge-submission 分开命名，便于在 Dashboard 区分流量来源
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9877}
  producer-group: cj_worker_producer
  consumer-group: cj_worker_consumer
  # 并发沙箱数上限（= 消费线程数）。0 = 不设置，沿用 RocketMQ 默认 20/64。
  # 判题机多实例时**必须**设置，否则并发 `docker run` 让容器冷启动吃满墙钟预算，
  #    正确解会被判假 TLE（2026-09-22 实测：3 实例 60 并发 → 抽样 18/25 假 TLE）。
  #    经验公式：实例数 × CJ_MQ_CONSUME_THREADS ≤ 宿主机 CPU 核数。详见 docs/PERF.md §3.7。
  consume-thread-min: ${CJ_MQ_CONSUME_THREADS:0}
  consume-thread-max: ${CJ_MQ_CONSUME_THREADS:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

cj:
  worker:
    image-java: ${CJ_SANDBOX_IMAGE_JAVA:codejudge/judge-java21:latest}
    image-python: ${CJ_SANDBOX_IMAGE_PYTHON:codejudge/judge-python312:latest}
    image-cpp: ${CJ_SANDBOX_IMAGE_CPP:codejudge/judge-gcc13:latest}
    image-go: ${CJ_SANDBOX_IMAGE_GO:codejudge/judge-go122:latest}
    sandbox-runtime: ${CJ_SANDBOX_RUNTIME:runc}
    seccomp-profile: ${CJ_SANDBOX_SECCOMP:sandbox/seccomp/judge-seccomp.json}
    cpus: ${CJ_SANDBOX_CPUS:1.0}
    pids-limit: ${CJ_SANDBOX_PIDS_LIMIT:64}
    # 编译阶段进程数上限：编译器自身重度 fork（Go 工具链实测 64 必失败、256 起正常），
    # 运行阶段仍用上面的 64 防 fork 炸弹。
    compile-pids-limit: ${CJ_SANDBOX_COMPILE_PIDS_LIMIT:256}
    max-output-kb: ${CJ_SANDBOX_MAX_OUTPUT_KB:1024}
    compile-timeout-ms: ${CJ_SANDBOX_COMPILE_TIMEOUT_MS:30000}
    compile-memory-mb: 512
    wall-clock-grace-ms: ${CJ_SANDBOX_WALL_GRACE_MS:5000}
    heartbeat-interval-seconds: ${CJ_JUDGE_WORKER_HEARTBEAT_SECONDS:30}
    heartbeat-ttl-seconds: ${CJ_JUDGE_WORKER_HEARTBEAT_SECONDS:30}
    work-root: ${CJ_WORKER_WORK_ROOT:logs/worker-work}
    # 判题进度推送（P4）：生产端限流，末用例与短路帧不受该间隔限制
    progress-enabled: ${CJ_JUDGE_PROGRESS_ENABLED:true}
    progress-min-interval-ms: ${CJ_JUDGE_PROGRESS_MIN_INTERVAL_MS:800}

springdoc:
  api-docs:
    # 内部判题服务：接口文档保持关闭（未走 CJ_SPRINGDOC_ENABLED 总开关）
    enabled: false

logging:
  level:
    com.codejudge.worker: info
