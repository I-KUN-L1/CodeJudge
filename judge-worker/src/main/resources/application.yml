server:
  port: 9085
  # 判题机多实例：9085 / 9185 / 9285（--server.port 覆盖）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 统一 application 标签：Grafana 用 `application` 做多服务切换/聚合。
      # 不设的话只能按 instance(host:port) 聚合，端口一变面板全废。
      application: ${spring.application.name}
    distribution:
      # 直方图：让 Prometheus 能用 histogram_quantile() 算 P95/P99 延迟。
      # 不开只能拿到 _count/_sum/_max（平均值会掩盖长尾），"延迟" 面板就失去意义。
      percentiles-histogram:
        http.server.requests: true

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: judge-worker
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # worker 直接读写 judge_submission 库（判题执行的单写者：judge_result/compile_info/submission 终态）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/judge_submission?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    discovery:
      client:
        simple:
          instances:
            judge-problem:
              - uri: ${SVC_PROBLEM_URI:http://localhost:9083}

# RocketMQ：worker 既是消费者（CREATED/RETRY）也是生产者（自产 RETRY / 发布 RESULT / 投递 DLQ），
# 生产者组与 judge-submission 分开命名，便于在 Dashboard 区分流量来源
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9877}
  producer-group: cj_worker_producer
  consumer-group: cj_worker_consumer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

cj:
  worker:
    image-java: ${CJ_SANDBOX_IMAGE_JAVA:judge-java21:latest}
    image-python: ${CJ_SANDBOX_IMAGE_PYTHON:judge-python3.12:latest}
    image-cpp: ${CJ_SANDBOX_IMAGE_CPP:judge-gcc13:latest}
    image-go: ${CJ_SANDBOX_IMAGE_GO:judge-go1.22:latest}
    sandbox-runtime: ${CJ_SANDBOX_RUNTIME:runc}
    seccomp-profile: ${CJ_SANDBOX_SECCOMP:sandbox/seccomp/judge-seccomp.json}
    cpus: ${CJ_SANDBOX_CPUS:1.0}
    pids-limit: ${CJ_SANDBOX_PIDS_LIMIT:64}
    max-output-kb: ${CJ_SANDBOX_MAX_OUTPUT_KB:64}
    compile-timeout-ms: ${CJ_SANDBOX_COMPILE_TIMEOUT_MS:30000}
    compile-memory-mb: 512
    wall-clock-grace-ms: ${CJ_SANDBOX_WALL_GRACE_MS:5000}
    heartbeat-interval-seconds: ${CJ_JUDGE_WORKER_HEARTBEAT_SECONDS:30}
    heartbeat-ttl-seconds: ${CJ_JUDGE_WORKER_HEARTBEAT_SECONDS:30}
    work-root: ${CJ_WORKER_WORK_ROOT:logs/worker-work}
    # 判题进度推送（P4）：生产端限流，末用例与短路帧不受该间隔限制
    progress-enabled: ${CJ_JUDGE_PROGRESS_ENABLED:true}
    progress-min-interval-ms: ${CJ_JUDGE_PROGRESS_MIN_INTERVAL_MS:800}

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    com.codejudge.worker: info
